<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800">

    <!-- شريط التنقل البسيط (Minimalist Navbar) -->
    <nav class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-gray-100 z-50">
        <div class="max-w-5xl mx-auto px-6 h-20 flex items-center justify-end">
            
            <!-- روابط التنقل بنفس النمط في الصورة -->
            <div class="hidden md:flex space-x-10 text-sm tracking-widest font-medium">
                <a href="#about" class="text-gray-500 hover:text-black transition-colors">ABOUT</a>
                <a href="#skills" class="text-gray-500 hover:text-black transition-colors">SKILLS</a>
                <a href="#projects" class="text-gray-500 hover:text-black transition-colors">PROJECTS</a>
                <a href="#contact" class="text-gray-500 hover:text-black transition-colors">CONTACT</a>
                <a href="#resume" class="text-gray-500 hover:text-black transition-colors">RESUME</a>
                <a href="#blog" class="text-gray-500 hover:text-black transition-colors">BLOG</a>
            </div>

            <!-- زر القائمة للهواتف -->
            <div class="md:hidden flex items-center">
                <button id="mobile-menu-button" class="text-gray-600 hover:text-black focus:outline-none">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- القائمة المنسدلة للهواتف -->
        <div id="mobile-menu" class="hidden md:hidden px-6 py-4 space-y-3 bg-white border-b border-gray-100 text-sm tracking-widest">
            <a href="#about" class="block text-gray-600 hover:text-black">ABOUT</a>
            <a href="#skills" class="block text-gray-600 hover:text-black">SKILLS</a>
            <a href="#projects" class="block text-gray-600 hover:text-black">PROJECTS</a>
            <a href="#contact" class="block text-gray-600 hover:text-black">CONTACT</a>
            <a href="#resume" class="block text-gray-600 hover:text-black">RESUME</a>
            <a href="#blog" class="block text-gray-600 hover:text-black">BLOG</a>
        </div>
    </nav>

    <script>
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });
    </script>

</body>
</html>
